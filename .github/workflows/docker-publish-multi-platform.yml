name: Release Docker Image

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_DESCRIPTION: Community proof-of-value proxy for Ollama that scans prompts and responses with the Palo Alto Networks Prisma AIRS AI Runtime API.

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 #3.11.1

      - name: Log in to the Container registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 #3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a #3.8.1

      - name: Derive image metadata
        id: meta
        run: |
          IMAGE_NAME=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${{ env.REGISTRY }}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_url=${{ github.server_url }}/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 #6.18.0
        with:
          pull: true
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}:latest
            ${{ steps.meta.outputs.image_ref }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=panw-api-ollama
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ steps.meta.outputs.release_url }}
            org.opencontainers.image.url=${{ steps.meta.outputs.release_url }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }} Release notes: ${{ steps.meta.outputs.release_url }}
          # ghcr reads the description of a multi-arch image from the index
          # annotations, not from per-platform labels.
          annotations: |
            index:org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }} Release notes: ${{ steps.meta.outputs.release_url }}
          cache-from: |
            type=gha
            type=registry,ref=${{ steps.meta.outputs.image_ref }}:cache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=${{ steps.meta.outputs.image_ref }}:cache,mode=max

      - name: Sign image with cosign (keyless)
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          cosign sign --yes "${IMAGE_REF}@${DIGEST}"

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be #v2.4.0
        with:
          subject-name: ${{ steps.meta.outputs.image_ref }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Append pull instructions to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          BODY=$(gh release view "$VERSION" --json body -q .body)
          APPEND=$(cat <<EOF

          ---

          ## Docker image

          Multi-arch (linux/amd64, linux/arm64). Signed with cosign (keyless, GitHub OIDC). Build provenance attested.

          \`\`\`bash
          docker pull ${IMAGE_REF}:${VERSION}
          # or pin by digest
          docker pull ${IMAGE_REF}@${DIGEST}
          \`\`\`

          Verify signature:

          \`\`\`bash
          cosign verify ${IMAGE_REF}@${DIGEST} \\
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF
          )
          printf '%s\n%s' "$BODY" "$APPEND" | gh release edit "$VERSION" --notes-file -
